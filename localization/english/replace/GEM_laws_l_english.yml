l_english:
  lawgroup_labor_rights: "Workplace Safety"
  lawgroup_labor_rights_desc: "Regulations imposed in order to protect workers against occupational hazards and illnesses."
  
  law_no_workers_rights: "No Safety Regulations"
  law_no_workers_rights_desc: "Employers are not under any obligation to maintain safe working conditions."
  law_regulatory_bodies: "Public Oversight"
  law_workmens_compensation: "Workmen's Compensation"
  law_workmens_compensation_desc: "Workers are entitled to claim compensation for injuries and illnesses caused by employer negligence."
  law_regulatory_bodies_desc: "Regular inspections are conducted by the government to monitor and keep track of unsafe workplaces."
  law_worker_protections: "Strict Precautions"
  law_worker_protections_desc: "Employers are obligated to minimise safety hazards as much as possible in the workplace, and are assumed to be liable for any workplace injury by default."

  lawgroup_job_security: "Job Security"
  lawgroup_job_security_desc: "The extent to which workers are protected from dismissal by their employer."

  law_no_job_security: "No Job Security"
  law_no_job_security_desc: "Employers are free to dismiss workers without any mandatory justification."
  law_notice_periods: "Notice Periods"
  law_notice_periods_desc: "Employers must give reasonable notice prior to dimissal of a worker."
  law_unfair_dismissal: "Unfair Dismissal"
  law_unfair_dismissal_desc: "An employer must provide reasonable justification in order to dismiss a worker, and staff may be reinstated if it is found that they were dismissed unfairly."
  law_job_for_life: "Job for Life"
  law_job_for_life_desc: "Strict regulations on the dismissal of workers, coupled with a mandate for full employment, effectively ensure all workers are guaranteed a job for life."

  lawgroup_remuneration: "Remuneration"
  lawgroup_remuneration_desc: "Laws regarding wage-setting and the compensatory packages of employees."

  law_unregulated_wages: "Unregulated Wages"
  law_unregulated_wages_desc: "Wage-setting is determined solely by market conditions, and there is no government involvement or specific guarantee of any kind of compensation for labour."
  law_wage_subsidies: "Wage Subsidies"
  law_wage_subsidies_desc: "The government tops up low wages to ensure they reach at least subsistence level, ensuring a flexible labour market whilst ensuring a minimum living standard."
  law_statutory_minimum: "Statutory Minimum"
  law_statutory_minimum_desc: "The government maintains a compulsory legal floor for all wages and compensation that all employees are entitled to receive."
  law_sectoral_bargaining: "Sectoral Bargaining"
  law_sectoral_bargaining_desc: "Industry-specific minimum wages are set through a structured, participatory system through which unions and employers negotiate working conditions and form legally binding agreements."